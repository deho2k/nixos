layerrule = animation slide left, match:namespace qs-slide-left
layerrule = animation slide bottom, match:namespace qs-slide-bottom
layerrule = animation slide top, match:namespace qs-slide-top
layerrule = no_anim on, match:namespace qs-no-animation

windowrule {
  name = clipse
  match:class = clipse
  float = true
  size = 1200 800
}
windowrule {
  name = windowrule-1
  suppress_event = maximize
  match:class = .*
}

windowrule {
  name = windowrule-2
  no_focus = on
  match:class = ^$
  match:title = ^$
  match:xwayland = 1
  match:float = 1
  match:fullscreen = 0
  match:pin = 0
}


windowrule {
  name = waypaper-float
  float = on
  match:class = waypaper
}


windowrule {
  name = spotify-rule
  workspace = special:utils silent
  rounding = 0
  opacity = 0.7
  match:class = ^(spotify)$
}
windowrule {
  name = quickshell-setting
  float = yes
  opacity = 0.9
  rounding = 16
  match:title = Settings
}

workspace = special:utils, gapsin:0, gapsout:50, border_size: 5
workspace = special:magic, gapsin:0, gapsout:30, border_size: 5

